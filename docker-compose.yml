services:

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    depends_on:
      - db
    environment:
      ZOOKEEPER_CLIENT_PORT: 9999
      ZOOKEEPER_TICK_TIME: 2000


  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9001:9001"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:9999
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9001
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  friendship-offers-db:
    image: postgres:latest
    depends_on:
      - kafka
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: friendship_manager
    ports:
      - "5431:5432"


  p2p-signaling:
    image: monamimamimamo/p2p-signaling:1.1
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      server.ssl.key-store: classpath:keystore.jks
      server.ssl.key-store-type: JKS
      server.ssl.key-store-password: aA258007195
      spring.kafka.bootstrap-servers: kafka:9001

  p2p-chat:
    image: monamimamimamo/p2p-chat:1.1
    depends_on:
      - kafka
      - messages-db
    ports:
      - "9003:9003"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://messages-db:5432/p2p_chat
      spring.kafka.bootstrap-servers: kafka:9001
      #server.ssl.key-store: classpath:keystore.jks
      #server.ssl.key-store-type: JKS
      #server.ssl.key-store-password: aA258007195


  messages-db:
    image: postgres:latest
    depends_on:
      - kafka
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: p2p_chat
    ports:
      - "5430:5432"

  friendship-manager:
    image: monamimamimamo/friendship-manager:1.3
    depends_on:
      - kafka
      - friendship-offers-db
    ports:
      - "9004:9004"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://friendship-offers-db:5432/friendship_manager
      server.ssl.key-store: classpath:keystore.jks
      server.ssl.key-store-type: JKS
      server.ssl.key-store-password: aA258007195
      spring.kafka.bootstrap-servers: kafka:9001



  identityapi:
    image: sunbros/identityapi
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=Voice;Username=postgres;Password=qe13zc24680
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=aA258007195
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - db
    volumes:
      - ./aspnetapp.pfx:/home/app/.aspnet/https/aspnetapp.pfx:ro

  usermanagerapi:
    image: sunbros/usermanagerapi:1.3.4
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=Voice;Username=postgres;Password=qe13zc24680
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=aA258007195
      - ASPNETCORE_HTTP_PORTS=8082
      - ASPNETCORE_HTTPS_PORTS=8083
    ports:
      - "8082:8082"
      - "8083:8083"
    depends_on:
      - kafka
      - db
      - identityapi
    volumes:
      - ./aspnetapp.pfx:/home/app/.aspnet/https/aspnetapp.pfx:ro

  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: Voice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qe13zc24680
    ports:
      - "5432:5432"

volumes:
  db_data: