<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Парный Чат</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="./js/socket.io.js"></script>
    <script src="./js/materialize.min.js"></script>
</head>

<body>
<h1>Парный Чат</h1>
<form id="loginForm">
    <label for="myLogin">Мой логин:</label><br>
    <input type="text" id="myLogin" name="myLogin"><br>
    <label for="otherLogin">Логин получателя:</label><br>
    <input type="text" id="otherLogin" name="otherLogin"><br>
    <button onclick="joinChat(event)">Зайти в чат</button>
</form>
<div id="chatContainer">
    <input type="text" id="messageInput" placeholder="Введите сообщение..." oninput="">checkInputLength()
    <button onclick="sendMessage()">Отправить</button>
    <ul id="messagesList"></ul>
</div>

<script>
    var myLogin;
    var otherLogin;
    var socket = io.connect(`http://127.0.0.1:1111/chat`);
    var roomID;

    $(document).ready(function(){
        socket.on("connect", function() {
            console.log("Connected");
        });

        socket.on('newMessage', function(data) {
            console.log(data);
        });

        socket.on('userTyping', function(sender) {
            console.log(`${sender} начал печатать...`);
        });

        socket.on('userStopTyping', function(sender) {
            console.log(`${sender} перестал печатать.`);
        });

        socket.on('joinResponse', function(data) {
            roomID = data.roomID;
        });

    });

    function sendMessage() {
        var input = document.getElementById('messageInput');
        var content = input.value.trim();
        if (content.length > 0) {
            socket.emit('sendMessage', {
                roomID: roomID,
                message: {sender: myLogin, receiver: otherLogin, content: content }
            });
        input.value = '';
        }
    }


    function joinChat(event) {
        event.preventDefault(); // Предотвращаем стандартное поведение формы
        myLogin = document.getElementById('myLogin').value.trim();
        otherLogin = document.getElementById('otherLogin').value.trim();
        socket.emit('joinChat', { sender: myLogin, receiver: otherLogin });
        console.log("message sent");
    }
</script>
</body>
</html>


function checkInputLength() {
var input = document.getElementById('messageInput');
var content = input.value.trim();
if (content.length > 0) {
socket.emit('userTyping', { isTyping: true });
} else {
socket.emit('userStopTyping', { isTyping: false });
}
}
